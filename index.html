<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Runner</title>
<style>
  :root {
    --bg: #0a0a12;
    --accent: #00ffc8;
    --danger: #ff3366;
    --gold: #ffd700;
    --card: rgba(255,255,255,0.04);
    --text: #e0e8f0;
    --muted: #5a6a80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }

  #gameWrapper {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 9/16;
    max-height: 95vh;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(0,255,200,0.08), 0 0 120px rgba(0,255,200,0.03);
  }

  #ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    overflow: hidden;
  }

  #ui.active { pointer-events: auto; }

  .overlay {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    background: rgba(6,6,14,0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 24px;
    text-align: center;
    animation: fadeIn 0.3s ease;
  }

  .overlay.visible { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .overlay h1 {
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), #00ddaa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .overlay p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    max-width: 300px;
    margin-bottom: 24px;
  }

  .overlay .score-display {
    font-size: clamp(40px, 10vw, 64px);
    font-weight: 900;
    color: var(--gold);
    margin: 8px 0;
    text-shadow: 0 0 30px rgba(255,215,0,0.3);
  }

  .overlay .score-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .overlay .best {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 28px;
  }

  .btn {
    background: linear-gradient(135deg, var(--accent), #00ddaa);
    color: #0a0a12;
    border: none;
    padding: 14px 48px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 24px rgba(0,255,200,0.25);
    pointer-events: auto;
  }

  .btn:hover { transform: scale(1.05); box-shadow: 0 6px 32px rgba(0,255,200,0.35); }
  .btn:active { transform: scale(0.97); }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .hud-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .hud-value {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    text-shadow: 0 0 12px rgba(0,255,200,0.3);
  }

  .hud-value.gold { color: var(--gold); text-shadow: 0 0 12px rgba(255,215,0,0.3); }

  #controls {
    position: absolute;
    bottom: 16px; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 60px;
    pointer-events: auto;
  }

  .ctrl-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(0,255,200,0.25);
    background: rgba(0,255,200,0.06);
    color: var(--accent);
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.1s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .ctrl-btn:active, .ctrl-btn.pressed {
    background: rgba(0,255,200,0.2);
    transform: scale(0.92);
  }

  @media (min-width: 600px) {
    #controls { display: none; }
  }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="game"></canvas>

  <div id="hud" style="display:none;">
    <div class="hud-item">
      <span class="hud-label">Score</span>
      <span class="hud-value gold" id="scoreVal">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Level</span>
      <span class="hud-value" id="levelVal">1</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Lives</span>
      <span class="hud-value" id="livesVal">3</span>
    </div>
  </div>

  <div id="ui" class="active">
    <!-- Start screen -->
    <div class="overlay visible" id="startScreen">
      <h1>Void Runner</h1>
      <p>Dodge the red shards. Collect golden orbs. Survive the void as long as you can.</p>
      <p style="font-size:12px; margin-bottom:20px; color:#3a4a5a;">Arrow keys / A,D / Mouse to move</p>
      <button class="btn" id="startBtn">Start Run</button>
    </div>

    <!-- Game Over screen -->
    <div class="overlay" id="overScreen">
      <div class="score-label">Final Score</div>
      <div class="score-display" id="finalScore">0</div>
      <div class="best" id="bestScore">Best: 0</div>
      <button class="btn" id="retryBtn">Run Again</button>
    </div>
  </div>

  <!-- Touch controls for mobile -->
  <div id="controls">
    <button class="ctrl-btn" id="leftBtn">&#9664;</button>
    <button class="ctrl-btn" id="rightBtn">&#9654;</button>
  </div>
</div>

<script>
(function() {
  /* ── Canvas Setup ── */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 480, H = 854;
  canvas.width = W;
  canvas.height = H;

  /* ── DOM refs ── */
  const ui = document.getElementById('ui');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const hud = document.getElementById('hud');
  const scoreVal = document.getElementById('scoreVal');
  const levelVal = document.getElementById('levelVal');
  const livesVal = document.getElementById('livesVal');
  const finalScore = document.getElementById('finalScore');
  const bestScore = document.getElementById('bestScore');

  /* ── Game State ── */
  let state = 'menu'; // menu | play | over
  let score, level, lives, frameCount;
  let player, orbs, shards, particles, bgStars;
  let shakeTimer = 0, shakeMag = 0;

  /* ── High Score ── */
  let highScore = parseInt(localStorage.getItem('voidRunnerHigh') || '0', 10);

  /* ── Input ── */
  const keys = { left: false, right: false };
  let mouseX = W / 2;
  let useMouseControl = false;

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') { keys.left = true; useMouseControl = false; }
    if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = true; useMouseControl = false; }
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = ((e.clientX - rect.left) / rect.width) * W;
    useMouseControl = true;
  });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    mouseX = ((e.touches[0].clientX - rect.left) / rect.width) * W;
    useMouseControl = true;
  }, { passive: false });

  /* Mobile buttons */
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  function bindTouch(btn, key) {
    const start = () => { keys[key] = true; btn.classList.add('pressed'); useMouseControl = false; };
    const end = () => { keys[key] = false; btn.classList.remove('pressed'); };
    btn.addEventListener('touchstart', e => { e.preventDefault(); start(); }, { passive: false });
    btn.addEventListener('touchend', e => { e.preventDefault(); end(); });
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
  }
  bindTouch(leftBtn, 'left');
  bindTouch(rightBtn, 'right');

  /* ── Buttons ── */
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  /* ── Background Stars ── */
  function initStars() {
    bgStars = [];
    for (let i = 0; i < 120; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        speed: Math.random() * 0.6 + 0.2,
        alpha: Math.random() * 0.5 + 0.2
      });
    }
  }

  /* ── Init / Reset ── */
  function startGame() {
    score = 0; level = 1; lives = 3; frameCount = 0;
    player = { x: W / 2, y: H - 100, w: 28, h: 36, speed: 6, trail: [] };
    orbs = []; shards = []; particles = [];
    initStars();

    startScreen.classList.remove('visible');
    overScreen.classList.remove('visible');
    ui.classList.remove('active');
    hud.style.display = 'flex';
    state = 'play';
  }

  function gameOver() {
    state = 'over';
    hud.style.display = 'none';
    ui.classList.add('active');
    overScreen.classList.add('visible');
    finalScore.textContent = score;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('voidRunnerHigh', highScore);
    }
    bestScore.textContent = 'Best: ' + highScore;

    /* Death explosion */
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 1;
      particles.push({
        x: player.x, y: player.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1, decay: Math.random() * 0.02 + 0.015,
        r: Math.random() * 4 + 2,
        color: Math.random() > 0.5 ? '#ff3366' : '#00ffc8'
      });
    }
  }

  /* ── Spawn Entities ── */
  function spawnOrb() {
    orbs.push({
      x: Math.random() * (W - 60) + 30,
      y: -20,
      r: 10,
      speed: Math.random() * 1.5 + 1.5 + level * 0.15,
      pulse: Math.random() * Math.PI * 2
    });
  }

  function spawnShard() {
    const size = Math.random() * 14 + 14;
    shards.push({
      x: Math.random() * (W - 60) + 30,
      y: -30,
      w: size,
      h: size,
      speed: Math.random() * 2 + 2 + level * 0.3,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.06
    });
  }

  /* ── Collision ── */
  function rectCircle(rx, ry, rw, rh, cx, cy, cr) {
    const nearX = Math.max(rx, Math.min(cx, rx + rw));
    const nearY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nearX, dy = cy - nearY;
    return dx * dx + dy * dy < cr * cr;
  }

  function rectRect(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  /* ── Particles ── */
  function emitParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 0.5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1, decay: Math.random() * 0.025 + 0.02,
        r: Math.random() * 3 + 1,
        color
      });
    }
  }

  /* ── Update ── */
  function update() {
    if (state !== 'play') return;
    frameCount++;

    /* Level up every 500 points */
    const newLevel = Math.floor(score / 500) + 1;
    if (newLevel !== level) {
      level = newLevel;
      emitParticles(player.x, player.y, '#00ffc8', 15);
    }

    /* Player movement */
    if (useMouseControl) {
      const dx = mouseX - player.x;
      player.x += dx * 0.12;
    } else {
      if (keys.left) player.x -= player.speed;
      if (keys.right) player.x += player.speed;
    }
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

    /* Trail */
    player.trail.unshift({ x: player.x, y: player.y + player.h / 2 });
    if (player.trail.length > 12) player.trail.pop();

    /* Spawn logic — difficulty ramps with level */
    const orbInterval = Math.max(40, 80 - level * 4);
    const shardInterval = Math.max(15, 45 - level * 3);
    if (frameCount % orbInterval === 0) spawnOrb();
    if (frameCount % shardInterval === 0) spawnShard();

    /* Update orbs */
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      o.y += o.speed;
      o.pulse += 0.08;
      if (o.y > H + 30) { orbs.splice(i, 1); continue; }

      /* Collect */
      const px = player.x - player.w / 2, py = player.y - player.h / 2;
      if (rectCircle(px, py, player.w, player.h, o.x, o.y, o.r + 4)) {
        score += 50;
        emitParticles(o.x, o.y, '#ffd700', 10);
        orbs.splice(i, 1);
      }
    }

    /* Update shards */
    for (let i = shards.length - 1; i >= 0; i--) {
      const s = shards[i];
      s.y += s.speed;
      s.rot += s.rotSpeed;
      if (s.y > H + 40) { shards.splice(i, 1); continue; }

      /* Hit player */
      const px = player.x - player.w / 2, py = player.y - player.h / 2;
      const sx = s.x - s.w / 2, sy = s.y - s.h / 2;
      if (rectRect(px + 4, py + 4, player.w - 8, player.h - 8, sx + 3, sy + 3, s.w - 6, s.h - 6)) {
        lives--;
        shakeTimer = 12; shakeMag = 6;
        emitParticles(s.x, s.y, '#ff3366', 12);
        shards.splice(i, 1);
        if (lives <= 0) { gameOver(); return; }
      }
    }

    /* Score ticks up over time */
    if (frameCount % 6 === 0) score++;

    /* Update particles */
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.04;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }

    /* Update stars */
    for (const s of bgStars) {
      s.y += s.speed + level * 0.15;
      if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
    }

    /* HUD */
    scoreVal.textContent = score;
    levelVal.textContent = level;
    livesVal.textContent = lives;

    /* Shake decay */
    if (shakeTimer > 0) shakeTimer--;
  }

  /* ── Draw ── */
  function draw() {
    ctx.save();

    /* Screen shake */
    if (shakeTimer > 0) {
      const sx = (Math.random() - 0.5) * shakeMag;
      const sy = (Math.random() - 0.5) * shakeMag;
      ctx.translate(sx, sy);
    }

    /* Background */
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#06060e');
    bgGrad.addColorStop(0.5, '#0a0a18');
    bgGrad.addColorStop(1, '#0e0a14');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    /* Stars */
    if (bgStars) {
      for (const s of bgStars) {
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = '#c0d8f0';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    /* Grid lines (subtle) */
    ctx.strokeStyle = 'rgba(0,255,200,0.025)';
    ctx.lineWidth = 1;
    const gridOffset = (frameCount * 1.5) % 60;
    for (let y = gridOffset; y < H; y += 60) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    if (state === 'play' || state === 'over') {
      /* Orbs */
      for (const o of orbs) {
        const pulse = Math.sin(o.pulse) * 3;
        /* Glow */
        const glow = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r + 12 + pulse);
        glow.addColorStop(0, 'rgba(255,215,0,0.35)');
        glow.addColorStop(1, 'rgba(255,215,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r + 12 + pulse, 0, Math.PI * 2);
        ctx.fill();

        /* Core */
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r + pulse * 0.3, 0, Math.PI * 2);
        ctx.fill();

        /* Shine */
        ctx.fillStyle = 'rgba(255,255,240,0.6)';
        ctx.beginPath();
        ctx.arc(o.x - 3, o.y - 3, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      /* Shards */
      for (const s of shards) {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        /* Glow */
        ctx.shadowColor = '#ff3366';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.moveTo(0, -s.h / 2);
        ctx.lineTo(s.w / 2, 0);
        ctx.lineTo(0, s.h / 2);
        ctx.lineTo(-s.w / 2, 0);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        /* Inner highlight */
        ctx.fillStyle = 'rgba(255,150,180,0.4)';
        ctx.beginPath();
        const inner = 0.5;
        ctx.moveTo(0, -s.h / 2 * inner);
        ctx.lineTo(s.w / 2 * inner, 0);
        ctx.lineTo(0, s.h / 2 * inner);
        ctx.lineTo(-s.w / 2 * inner, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      /* Player trail */
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        const alpha = (1 - i / player.trail.length) * 0.3;
        const size = (1 - i / player.trail.length) * 8;
        ctx.fillStyle = `rgba(0,255,200,${alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, Math.max(0.5, size), 0, Math.PI * 2);
        ctx.fill();
      }

      /* Player ship */
      if (state === 'play') {
        ctx.save();
        ctx.translate(player.x, player.y);

        /* Engine glow */
        const engineGlow = ctx.createRadialGradient(0, player.h / 2 + 6, 0, 0, player.h / 2 + 6, 20);
        engineGlow.addColorStop(0, 'rgba(0,255,200,0.6)');
        engineGlow.addColorStop(0.5, 'rgba(0,200,160,0.15)');
        engineGlow.addColorStop(1, 'rgba(0,255,200,0)');
        ctx.fillStyle = engineGlow;
        ctx.beginPath();
        ctx.arc(0, player.h / 2 + 6, 20, 0, Math.PI * 2);
        ctx.fill();

        /* Body */
        ctx.shadowColor = '#00ffc8';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#00ffc8';
        ctx.beginPath();
        ctx.moveTo(0, -player.h / 2);
        ctx.lineTo(-player.w / 2, player.h / 2);
        ctx.lineTo(-4, player.h / 3);
        ctx.lineTo(0, player.h / 2 + 4);
        ctx.lineTo(4, player.h / 3);
        ctx.lineTo(player.w / 2, player.h / 2);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        /* Cockpit */
        ctx.fillStyle = '#0a2a28';
        ctx.beginPath();
        ctx.arc(0, -2, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,255,200,0.5)';
        ctx.beginPath();
        ctx.arc(0, -2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      /* Particles */
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.5, p.r * p.life), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  /* ── Loop ── */
  initStars();
  let animId;
  function loop() {
    update();
    draw();
    animId = requestAnimationFrame(loop);
  }
  loop();

  /* ── Respect reduced motion ── */
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (motionQuery.matches) {
    /* Still playable, just skip some visual flair */
    player && (player.trail = []);
  }
})();
</script>
</body>
</html>
