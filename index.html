<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Racer</title>
<style>
  :root {
    --bg: #0a0a0f;
    --fg: #e8e6e3;
    --accent: #ff3c38;
    --accent2: #00e676;
    --card: rgba(20,20,30,0.85);
    --muted: #6b6b7b;
  }
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #gameWrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    aspect-ratio: 4/3;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(255,60,56,0.15), 0 0 120px rgba(0,230,118,0.08);
  }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  .hud-block {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 18px;
    min-width: 110px;
  }

  .hud-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    font-family: 'Orbitron', monospace;
  }

  .hud-value {
    font-size: 26px;
    font-weight: 900;
    font-family: 'Orbitron', monospace;
    color: var(--fg);
    line-height: 1.2;
  }

  .hud-value.speed { color: var(--accent); }
  .hud-value.score { color: var(--accent2); }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(6,6,12,0.88);
    backdrop-filter: blur(12px);
    z-index: 20;
    border-radius: 8px;
    transition: opacity 0.4s;
  }

  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #overlay h1 {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 48px;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--accent), #ff8a65);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  #overlay .sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
    letter-spacing: 1px;
  }

  #overlay .final-score {
    font-family: 'Orbitron', monospace;
    font-size: 56px;
    font-weight: 900;
    color: var(--accent2);
    margin-bottom: 6px;
  }

  #overlay .final-label {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .btn {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 44px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #e63946);
    color: #fff;
    letter-spacing: 2px;
    transition: transform 0.15s, box-shadow 0.25s;
    box-shadow: 0 4px 30px rgba(255,60,56,0.35);
  }

  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 40px rgba(255,60,56,0.5);
  }

  .controls-hint {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    background: rgba(255,255,255,0.04);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    color: var(--fg);
  }

  #mobileControls {
    position: absolute;
    bottom: 12px;
    left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 15;
    pointer-events: none;
  }

  .mobile-btn {
    pointer-events: all;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--fg);
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  .mobile-btn:active {
    background: rgba(255,60,56,0.25);
  }

  .steer-group {
    display: flex;
    gap: 10px;
  }

  @media (hover: none) and (pointer: coarse) {
    #mobileControls { display: flex; }
  }

  @media (max-width: 600px) {
    #overlay h1 { font-size: 32px; }
    .hud-block { padding: 6px 10px; min-width: 80px; }
    .hud-value { font-size: 18px; }
  }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">Speed</div>
      <div class="hud-value speed" id="speedVal">0</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Score</div>
      <div class="hud-value score" id="scoreVal">0</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Lives</div>
      <div class="hud-value" id="livesVal">3</div>
    </div>
  </div>

  <div id="overlay">
    <h1>NIGHT RACER</h1>
    <div class="sub">Dodge traffic. Survive the night.</div>
    <button class="btn" id="startBtn">START</button>
    <div class="controls-hint">
      <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      <span>or Arrow Keys</span>
    </div>
  </div>

  <div id="mobileControls">
    <div class="steer-group">
      <div class="mobile-btn" id="mLeft">&#9664;</div>
      <div class="mobile-btn" id="mRight">&#9654;</div>
    </div>
    <div class="steer-group">
      <div class="mobile-btn" id="mBrake">&#9660;</div>
      <div class="mobile-btn" id="mGas">&#9650;</div>
    </div>
  </div>
</div>

<script>
// ========== GAME ENGINE ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Internal resolution
const W = 800;
const H = 600;
canvas.width = W;
canvas.height = H;

// HUD elements
const speedEl = document.getElementById('speedVal');
const scoreEl = document.getElementById('scoreVal');
const livesEl = document.getElementById('livesVal');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

// ---- Road parameters ----
const ROAD_W = 2200;
const SEG_LEN = 200;
const RUMBLE_LEN = 3;
const DRAW_DIST = 150;
const LANES = 3;

const CAM_H = 1000;
const FOV = 100;

// ---- Colors ----
const SKY_TOP = '#0a0a1a';
const SKY_BOT = '#1a1028';
const FOG_COLOR = 'rgba(10,10,20,';

const COLORS = {
  LIGHT:  { road: '#4a4a52', grass: '#1a6b2a', rumble: '#cc2222', lane: '#cccccc' },
  DARK:   { road: '#3e3e46', grass: '#155a22', rumble: '#dddddd', lane: '#3e3e46' },
  START:  { road: '#ffffff', grass: '#1a6b2a', rumble: '#ffffff' },
  FINISH: { road: '#111111', grass: '#1a6b2a', rumble: '#111111' }
};

// ---- Game state ----
let segments = [];
let trackLength = 0;
let cars = [];

let position = 0;   // Z position along track
let playerX = 0;     // -1 to 1
let speed = 0;
const MAX_SPEED = SEG_LEN * 60; // segments per frame * fps
const ACCEL = MAX_SPEED / 3;
const BRAKE = -MAX_SPEED;
const DECEL = -MAX_SPEED / 5;
const OFF_ROAD_DECEL = -MAX_SPEED / 2;
const OFF_ROAD_MAX = MAX_SPEED / 3;
const CENTRIFUGAL = 0.3;

let score = 0;
let lives = 3;
let gameRunning = false;
let invincible = 0;
let flashTimer = 0;

// Stars for sky
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H * 0.5,
    r: Math.random() * 1.5 + 0.3,
    twinkle: Math.random() * Math.PI * 2
  });
}

// ---- Input ----
const keys = {};
document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Mobile controls
const mobileKeys = {};
function setupMobileBtn(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); mobileKeys[key] = true; });
  el.addEventListener('touchend', e => { e.preventDefault(); mobileKeys[key] = false; });
  el.addEventListener('touchcancel', e => { mobileKeys[key] = false; });
}
setupMobileBtn('mLeft', 'a');
setupMobileBtn('mRight', 'd');
setupMobileBtn('mGas', 'w');
setupMobileBtn('mBrake', 's');

function isKey(k) { return keys[k] || mobileKeys[k]; }

// ---- Build track ----
function buildTrack() {
  segments = [];

  function addSegment(curve, y) {
    const n = segments.length;
    segments.push({
      index: n,
      p1: { world: { z: n * SEG_LEN, y: y }, camera: {}, screen: {} },
      p2: { world: { z: (n + 1) * SEG_LEN, y: y }, camera: {}, screen: {} },
      curve: curve,
      color: Math.floor(n / RUMBLE_LEN) % 2 ? COLORS.DARK : COLORS.LIGHT
    });
  }

  function addRoad(enter, hold, leave, curve, y) {
    const startY = segments.length > 0 ? segments[segments.length - 1].p2.world.y : 0;
    const endY = startY + y * SEG_LEN;
    let total = enter + hold + leave;
    for (let n = 0; n < enter; n++) {
      const p = n / enter;
      addSegment(curve * p, easeInOut(n, total, startY, endY - startY));
    }
    for (let n = 0; n < hold; n++) {
      addSegment(curve, easeInOut(enter + n, total, startY, endY - startY));
    }
    for (let n = 0; n < leave; n++) {
      const p = 1 - n / leave;
      addSegment(curve * p, easeInOut(enter + hold + n, total, startY, endY - startY));
    }
  }

  function easeInOut(curr, total, start, delta) {
    return start + delta * (-Math.cos(curr / total * Math.PI) / 2 + 0.5);
  }

  // Build interesting track
  addRoad(10, 20, 10, 0, 0);           // straight
  addRoad(10, 30, 10, -2, 0);          // gentle left
  addRoad(10, 20, 10, 3, 0);           // right curve
  addRoad(10, 15, 10, 0, 30);          // uphill
  addRoad(10, 30, 10, -4, 0);          // hard left
  addRoad(10, 20, 10, 2, -30);         // downhill + right
  addRoad(10, 40, 10, 0, 0);           // long straight
  addRoad(10, 20, 10, 5, 20);          // sharp right + hill
  addRoad(15, 30, 15, -3, -20);        // left + down
  addRoad(10, 20, 10, 0, 0);           // straight
  addRoad(10, 25, 10, -5, 0);          // sharp left
  addRoad(10, 20, 10, 4, 10);          // right + up
  addRoad(10, 30, 10, 0, -10);         // straight + down
  addRoad(10, 20, 10, 2, 0);           // gentle right
  addRoad(10, 40, 10, 0, 0);           // long straight to finish

  trackLength = segments.length * SEG_LEN;

  // Spawn traffic
  cars = [];
  const carColors = ['#e63946','#f4a261','#2a9d8f','#e9c46a','#264653','#d62828','#6a4c93','#1982c4'];
  for (let i = 0; i < 40; i++) {
    const seg = Math.floor(Math.random() * segments.length);
    const lane = Math.floor(Math.random() * LANES);
    const laneX = -0.65 + lane * 0.65;
    cars.push({
      z: seg * SEG_LEN + Math.random() * SEG_LEN,
      x: laneX + (Math.random() - 0.5) * 0.15,
      speed: MAX_SPEED * (0.15 + Math.random() * 0.35),
      color: carColors[Math.floor(Math.random() * carColors.length)],
      w: 0.3
    });
  }
}

// ---- Projection ----
function project(p, cameraX, cameraY, cameraZ, cameraDepth) {
  p.camera.x = p.world.x || 0;
  p.camera.y = p.world.y - cameraY;
  p.camera.z = p.world.z - cameraZ;
  if (p.camera.z <= 0) p.camera.z = 0.01;
  p.screen.scale = cameraDepth / p.camera.z;
  p.screen.x = Math.round(W / 2 + p.screen.scale * p.camera.x * W / 2);
  p.screen.y = Math.round(H / 2 - p.screen.scale * p.camera.y * H / 2);
  p.screen.w = Math.round(p.screen.scale * ROAD_W * W / 2);
}

// ---- Render ----
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  grad.addColorStop(0, SKY_TOP);
  grad.addColorStop(1, SKY_BOT);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.5);

  // Stars
  const t = Date.now() * 0.001;
  for (const s of stars) {
    const alpha = 0.4 + 0.6 * Math.sin(t * 1.5 + s.twinkle);
    ctx.fillStyle = `rgba(255,255,240,${alpha.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Moon
  ctx.fillStyle = '#ffe8b0';
  ctx.shadowColor = '#ffe8b0';
  ctx.shadowBlur = 40;
  ctx.beginPath();
  ctx.arc(650, 80, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawSegmentQuad(color, x1, y1, w1, x2, y2, w2) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1 - w1, y1);
  ctx.lineTo(x1 + w1, y1);
  ctx.lineTo(x2 + w2, y2);
  ctx.lineTo(x2 - w2, y2);
  ctx.closePath();
  ctx.fill();
}

function drawSprite(seg, offset, car) {
  const s = seg.p1.screen.scale;
  const destX = seg.p1.screen.x + s * offset * W / 2;
  const destY = seg.p1.screen.y;
  const destW = car.w * W * s * 0.5;

  if (destW < 2 || destY < 0) return;

  const h = destW * 0.6;

  // Car body
  ctx.fillStyle = car.color;
  ctx.fillRect(destX - destW / 2, destY - h, destW, h);

  // Roof
  const roofW = destW * 0.6;
  const roofH = h * 0.45;
  ctx.fillStyle = shadeColor(car.color, -30);
  ctx.fillRect(destX - roofW / 2, destY - h - roofH * 0.4, roofW, roofH);

  // Windshield
  ctx.fillStyle = 'rgba(100,200,255,0.35)';
  ctx.fillRect(destX - roofW / 2 + 2, destY - h - roofH * 0.3, roofW - 4, roofH * 0.5);

  // Tail lights
  if (destW > 10) {
    ctx.fillStyle = '#ff2222';
    ctx.shadowColor = '#ff2222';
    ctx.shadowBlur = 8;
    ctx.fillRect(destX - destW / 2, destY - 4, 4, 3);
    ctx.fillRect(destX + destW / 2 - 4, destY - 4, 4, 3);
    ctx.shadowBlur = 0;
  }
}

function shadeColor(color, percent) {
  let R = parseInt(color.substring(1,3), 16);
  let G = parseInt(color.substring(3,5), 16);
  let B = parseInt(color.substring(5,7), 16);
  R = Math.max(0, Math.min(255, R + percent));
  G = Math.max(0, Math.min(255, G + percent));
  B = Math.max(0, Math.min(255, B + percent));
  return `rgb(${R},${G},${B})`;
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky();

  const baseSegIdx = Math.floor(position / SEG_LEN) % segments.length;
  const basePercent = (position % SEG_LEN) / SEG_LEN;
  const playerSeg = segments[baseSegIdx];
  const playerY = interpolate(playerSeg.p1.world.y, playerSeg.p2.world.y, basePercent);

  const cameraDepth = 1 / Math.tan((FOV / 2) * Math.PI / 180);
  let maxy = H;
  let x = 0;
  let dx = -(playerSeg.curve * basePercent);

  // Project segments
  for (let n = 0; n < DRAW_DIST; n++) {
    const idx = (baseSegIdx + n) % segments.length;
    const seg = segments[idx];
    const looped = (baseSegIdx + n) >= segments.length;
    const camZ = position - (looped ? trackLength : 0);

    seg.p1.world.x = x;
    seg.p1.world.y = seg.p1.world.y;
    project(seg.p1, playerX * ROAD_W, playerY + CAM_H, camZ, cameraDepth);

    seg.p2.world.x = x + dx;
    seg.p2.world.y = seg.p2.world.y;
    project(seg.p2, playerX * ROAD_W, playerY + CAM_H, camZ, cameraDepth);

    x += dx;
    dx += seg.curve;

    seg.clip = maxy;

    if (seg.p1.camera.z <= 0 || seg.p2.screen.y >= maxy || seg.p2.screen.y >= seg.p1.screen.y) continue;

    maxy = seg.p2.screen.y;

    // Grass
    drawSegmentQuad(seg.color.grass, 0, seg.p1.screen.y, W, 0, seg.p2.screen.y, W);

    // Road
    drawSegmentQuad(seg.color.rumble, seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w * 1.15, seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w * 1.15);
    drawSegmentQuad(seg.color.road, seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w, seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w);

    // Lane markings
    if (seg.color.lane !== seg.color.road) {
      const lw1 = seg.p1.screen.w / 40;
      const lw2 = seg.p2.screen.w / 40;
      for (let l = 1; l < LANES; l++) {
        const laneOff = -1 + (2 * l / LANES);
        const lx1 = seg.p1.screen.x + seg.p1.screen.w * laneOff;
        const lx2 = seg.p2.screen.x + seg.p2.screen.w * laneOff;
        drawSegmentQuad(seg.color.lane, lx1, seg.p1.screen.y, lw1, lx2, seg.p2.screen.y, lw2);
      }
    }

    // Fog
    const fogAlpha = Math.min(1, n / DRAW_DIST);
    if (fogAlpha > 0.01) {
      ctx.fillStyle = FOG_COLOR + fogAlpha.toFixed(3) + ')';
      ctx.fillRect(0, seg.p2.screen.y, W, seg.p1.screen.y - seg.p2.screen.y);
    }
  }

  // Draw cars (back to front)
  for (let n = DRAW_DIST - 1; n > 0; n--) {
    const idx = (baseSegIdx + n) % segments.length;
    const seg = segments[idx];

    for (const car of cars) {
      const carSegIdx = Math.floor(car.z / SEG_LEN) % segments.length;
      if (carSegIdx !== idx) continue;
      if (seg.p1.screen.y >= seg.clip) continue;

      // Position car on projected segment
      const carPercent = (car.z % SEG_LEN) / SEG_LEN;
      const spriteSeg = {
        p1: {
          screen: {
            x: interpolate(seg.p1.screen.x, seg.p2.screen.x, carPercent),
            y: interpolate(seg.p1.screen.y, seg.p2.screen.y, carPercent),
            scale: interpolate(seg.p1.screen.scale, seg.p2.screen.scale, carPercent),
            w: interpolate(seg.p1.screen.w, seg.p2.screen.w, carPercent)
          }
        },
        clip: seg.clip
      };
      drawSprite(spriteSeg, car.x, car);
    }
  }

  // Draw player car
  drawPlayerCar();

  // Speed lines effect at high speed
  if (speed > MAX_SPEED * 0.7) {
    const intensity = (speed - MAX_SPEED * 0.7) / (MAX_SPEED * 0.3);
    ctx.strokeStyle = `rgba(255,255,255,${(intensity * 0.15).toFixed(3)})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const sx = Math.random() * W;
      const sy = H * 0.4 + Math.random() * H * 0.4;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + (sx - W/2) * 0.1, sy + 30 + Math.random() * 40);
      ctx.stroke();
    }
  }
}

function drawPlayerCar() {
  const cx = W / 2;
  const cy = H - 80;
  const carW = 80;
  const carH = 50;

  // Invincibility flash
  if (invincible > 0 && Math.floor(invincible * 10) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 8, carW / 2 + 5, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  const bodyGrad = ctx.createLinearGradient(cx - carW/2, cy - carH, cx + carW/2, cy);
  bodyGrad.addColorStop(0, '#cc2936');
  bodyGrad.addColorStop(0.5, '#ff3c38');
  bodyGrad.addColorStop(1, '#cc2936');
  ctx.fillStyle = bodyGrad;

  // Main body shape
  ctx.beginPath();
  ctx.moveTo(cx - carW/2, cy);
  ctx.lineTo(cx - carW/2 + 5, cy - carH * 0.4);
  ctx.lineTo(cx - carW/3, cy - carH);
  ctx.lineTo(cx + carW/3, cy - carH);
  ctx.lineTo(cx + carW/2 - 5, cy - carH * 0.4);
  ctx.lineTo(cx + carW/2, cy);
  ctx.closePath();
  ctx.fill();

  // Roof / cabin
  ctx.fillStyle = '#a02020';
  ctx.beginPath();
  ctx.moveTo(cx - carW/3 + 5, cy - carH * 0.35);
  ctx.lineTo(cx - carW/4, cy - carH * 0.85);
  ctx.lineTo(cx + carW/4, cy - carH * 0.85);
  ctx.lineTo(cx + carW/3 - 5, cy - carH * 0.35);
  ctx.closePath();
  ctx.fill();

  // Windshield
  ctx.fillStyle = 'rgba(100,200,255,0.4)';
  ctx.beginPath();
  ctx.moveTo(cx - carW/3 + 8, cy - carH * 0.38);
  ctx.lineTo(cx - carW/4 + 3, cy - carH * 0.8);
  ctx.lineTo(cx + carW/4 - 3, cy - carH * 0.8);
  ctx.lineTo(cx + carW/3 - 8, cy - carH * 0.38);
  ctx.closePath();
  ctx.fill();

  // Headlights (front glow)
  const headGlow = 0.3 + 0.15 * Math.sin(Date.now() * 0.005);
  ctx.fillStyle = `rgba(255,240,200,${headGlow.toFixed(2)})`;
  ctx.shadowColor = '#fffcdc';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.ellipse(cx - carW/3, cy - carH * 0.95, 6, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + carW/3, cy - carH * 0.95, 6, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Tail lights glow
  ctx.fillStyle = 'rgba(255,50,50,0.8)';
  ctx.shadowColor = '#ff3232';
  ctx.shadowBlur = 15;
  ctx.fillRect(cx - carW/2 + 2, cy - 4, 8, 4);
  ctx.fillRect(cx + carW/2 - 10, cy - 4, 8, 4);
  ctx.shadowBlur = 0;

  // Steer visual tilt
  const steer = (isKey('a') || isKey('arrowleft')) ? -1 : (isKey('d') || isKey('arrowright')) ? 1 : 0;

  ctx.globalAlpha = 1;
}

function interpolate(a, b, percent) {
  return a + (b - a) * percent;
}

// ---- Update ----
function update(dt) {
  const segIdx = Math.floor(position / SEG_LEN) % segments.length;
  const seg = segments[segIdx];
  const speedPercent = speed / MAX_SPEED;

  // Steering
  const steerDir = (isKey('a') || isKey('arrowleft')) ? -1 : (isKey('d') || isKey('arrowright')) ? 1 : 0;
  playerX += steerDir * dt * 2 * speedPercent;

  // Centrifugal force
  playerX -= dt * speedPercent * seg.curve * CENTRIFUGAL;

  // Acceleration
  if (isKey('w') || isKey('arrowup')) {
    speed += ACCEL * dt;
  } else if (isKey('s') || isKey('arrowdown')) {
    speed += BRAKE * dt;
  } else {
    speed += DECEL * dt;
  }

  // Off-road
  if (Math.abs(playerX) > 1) {
    speed += OFF_ROAD_DECEL * dt;
    if (speed > OFF_ROAD_MAX) speed = OFF_ROAD_MAX;
    // Rumble
    playerX += (Math.random() - 0.5) * 0.02;
  }

  // Clamp
  speed = Math.max(0, Math.min(speed, MAX_SPEED));
  playerX = Math.max(-2.5, Math.min(2.5, playerX));

  // Move
  position += speed * dt;
  while (position >= trackLength) position -= trackLength;
  while (position < 0) position += trackLength;

  // Invincibility timer
  if (invincible > 0) invincible -= dt;

  // Collision with traffic
  if (invincible <= 0) {
    for (const car of cars) {
      const carW = car.w;
      const playerW = 0.3;
      if (Math.abs(car.z - position) < SEG_LEN * 0.8 &&
          Math.abs(car.x - playerX) < (carW + playerW) * 0.5) {
        // Hit!
        speed = Math.max(0, speed * 0.2);
        lives--;
        invincible = 2;
        flashTimer = 0.3;

        if (lives <= 0) {
          gameOver();
          return;
        }
        break;
      }
    }
  }

  // Flash effect timer
  if (flashTimer > 0) {
    flashTimer -= dt;
  }

  // Move traffic
  for (const car of cars) {
    car.z += car.speed * dt;
    while (car.z >= trackLength) car.z -= trackLength;
  }

  // Score
  score += Math.floor(speed * dt * 0.01);

  // Update HUD
  speedEl.textContent = Math.floor(speed / MAX_SPEED * 280);
  scoreEl.textContent = score;
  livesEl.textContent = '\u2764'.repeat(Math.max(0, lives));
}

function gameOver() {
  gameRunning = false;
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>WRECKED</h1>
    <div class="sub">Your run has ended</div>
    <div class="final-score">${score}</div>
    <div class="final-label">Final Score</div>
    <button class="btn" id="restartBtn">RACE AGAIN</button>
    <div class="controls-hint">
      <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      <span>or Arrow Keys</span>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', startGame);
}

function startGame() {
  position = 0;
  playerX = 0;
  speed = 0;
  score = 0;
  lives = 3;
  invincible = 0;
  flashTimer = 0;
  gameRunning = true;

  buildTrack();

  overlay.classList.add('hidden');
  // Reset overlay content for next game over
  setTimeout(() => {
    overlay.innerHTML = `
      <h1>NIGHT RACER</h1>
      <div class="sub">Dodge traffic. Survive the night.</div>
      <button class="btn" id="startBtn2">START</button>
      <div class="controls-hint">
        <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
        <span>or Arrow Keys</span>
      </div>
    `;
  }, 500);
}

// ---- Main loop ----
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (gameRunning) {
    update(dt);
  }

  render();

  // Hit flash
  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(255,60,60,${(flashTimer * 2).toFixed(2)})`;
    ctx.fillRect(0, 0, W, H);
  }

  requestAnimationFrame(gameLoop);
}

// ---- Init ----
buildTrack();
startBtn.addEventListener('click', startGame);
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
