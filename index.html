<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ludo 8 Players Online</title>

<!-- CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<!-- TITLE -->
<h1 class="title">🎲 Ludo 8 Players Online</h1>

<!-- HOME SCREEN -->
<div id="home" class="card">

<h2>Join or Create Room</h2>

<input id="playerName" placeholder="Enter Your Name">

<button class="primary" onclick="createRoom()">
Create Room
</button>

<input id="roomCode" placeholder="Enter Room Code">

<button class="secondary" onclick="joinRoom()">
Join Room
</button>

</div>

<!-- GAME SCREEN -->
<div id="game" class="hidden">

<div class="card">

<div class="turn">
Room Code: <span id="roomText">---</span>
</div>

</div>

<!-- PLAYERS -->
<div class="card">

<div class="players">

<div class="player red">Red</div>
<div class="player blue">Blue</div>
<div class="player green">Green</div>
<div class="player yellow">Yellow</div>
<div class="player purple">Purple</div>
<div class="player orange">Orange</div>
<div class="player pink">Pink</div>
<div class="player cyan">Cyan</div>

</div>

</div>

<!-- DICE -->
<div class="card">

<div class="turn">Roll Dice</div>

<div class="dice" id="dice">🎲</div>

<button class="primary" onclick="rollDice()">
Roll Dice
</button>

</div>

<!-- BOARD -->
<div class="card">

<div class="board" id="board"></div>

</div>

</div>

</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
