<!DOCTYPE html>
<html>
<head>
    <title>My Fast Trading App</title>
    <style>
        body { margin: 0; padding: 0; background: #131722; font-family: Arial, sans-serif; }
        .top-bar { background: #1e222d; padding: 10px; color: #d1d4dc; font-size: 18px; font-weight: bold; }
        .menu { background: #1e222d; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .menu button, .tf-menu button { background: #2B2B43; color: #d1d4dc; border: 1px solid #363a4e; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .menu button:hover, .tf-menu button:hover { background: #363a4e; }
        .menu button.active, .tf-menu button.active { background: #2962ff; color: white; border-color: #2962ff; }
        .tf-menu { background: #1e222d; padding: 10px; display: flex; gap: 10px; }
        #chart { width: 100vw; height: calc(100vh - 130px); }
    </style>
</head>
<body>
    <!-- Live Price Tag -->
    <div class="top-bar">Bitcoin: <span id="livePrice" style="color: #26a65b;">Loading...</span></div>

    <!-- Coin Buttons -->
    <div class="menu">
        <button class="active" onclick="switchCoin('BTCUSDT', this)">Bitcoin</button>
        <button onclick="switchCoin('ETHUSDT', this)">Ethereum</button>
        <button onclick="switchCoin('SOLUSDT', this)">Solana</button>
    </div>

    <!-- Timeframe Buttons -->
    <div class="tf-menu">
        <button onclick="switchTimeframe('1m', this)">1 Min</button>
        <button onclick="switchTimeframe('15m', this)">15 Min</button>
        <button class="active" onclick="switchTimeframe('1h', this)">1 Hour</button>
        <button onclick="switchTimeframe('1d', this)">1 Day</button>
    </div>

    <div id="chart"></div>
    
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <script>
        let currentSymbol = 'BTCUSDT';
        let currentTimeframe = '1h';

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            timeScale: { timeVisible: true, secondsVisible: false }
        });

        const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: 'rgb(38,166,91)', downColor: 'rgb(239,83,80)',
            borderDownColor: 'rgb(239,83,80)', borderUpColor: 'rgb(38,166,91)',
            wickDownColor: 'rgb(239,83,80)', wickUpColor: 'rgb(38,166,91)'
        });

        function switchCoin(symbol, buttonClicked) {
            const buttons = document.querySelectorAll('.menu button');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonClicked.classList.add('active');
            currentSymbol = symbol;
            updateChart();
        }

        function switchTimeframe(timeframe, buttonClicked) {
            const buttons = document.querySelectorAll('.tf-menu button');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonClicked.classList.add('active');
            currentTimeframe = timeframe;
            updateChart();
        }

        function updateChart() {
            fetch('https://api.binance.com/api/v3/klines?symbol=' + currentSymbol + '&interval=' + currentTimeframe + '&limit=100')
                .then(r => r.json())
                .then(data => {
                    const formatted = data.map(d => ({
                        time: d[0] / 1000,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));
                    candleSeries.setData(formatted);
                    chart.timeScale().fitContent();
                    
                    // Update the Live Price Tag with the very last close price
                    const latestPrice = formatted[formatted.length - 1].close;
                    document.getElementById('livePrice').innerText = latestPrice;
                });
        }

        // Load Bitcoin first
        updateChart();
            
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: window.innerWidth, height: window.innerHeight - 130 });
        });
    </script>
</body>
</html>
