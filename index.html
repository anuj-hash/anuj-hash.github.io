<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ludo 8 Players Online</title>

<!-- CSS FILE LINK (IMPORTANT) -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1 class="title">🎲 Ludo 8 Players Online</h1>

<!-- HOME SCREEN -->
<div id="home" class="card">

<input id="playerName" placeholder="Enter Your Name" />

<button class="primary" onclick="createRoom()">
Create Room
</button>

<input id="roomCode" placeholder="Enter Room Code" />

<button class="secondary" onclick="joinRoom()">
Join Room
</button>

</div>

<!-- GAME SCREEN -->
<div id="game" class="hidden">

<div class="card">

<div class="turn">
Room Code: <span id="roomText">---</span>
</div>

<div class="players">

<div class="player red">Player 1</div>
<div class="player blue">Player 2</div>
<div class="player green">Player 3</div>
<div class="player yellow">Player 4</div>
<div class="player purple">Player 5</div>
<div class="player orange">Player 6</div>
<div class="player pink">Player 7</div>
<div class="player cyan">Player 8</div>

</div>

</div>

<!-- DICE -->
<div class="card">

<div class="turn">Current Turn</div>

<div class="dice" id="dice">🎲</div>

<button class="primary" onclick="rollDice()">
Roll Dice
</button>

</div>

<!-- BOARD -->
<div class="card">

<div class="board" id="board"></div>

</div>

</div>

</div>

<script>
// CREATE BOARD CELLS (15x15 = 225)
const board = document.getElementById("board");

for (let i = 0; i < 225; i++) {
const cell = document.createElement("div");
cell.className = "cell";
board.appendChild(cell);
}

// RANDOM ROOM CODE
function generateCode() {
return Math.random().toString(36).substring(2, 8).toUpperCase();
}

// CREATE ROOM
function createRoom() {
const name = document.getElementById("playerName").value;

if (!name) {
alert("Enter your name");
return;
}

const room = generateCode();

startGame(room);
}

// JOIN ROOM
function joinRoom() {
const room = document.getElementById("roomCode").value;

if (!room) {
alert("Enter room code");
return;
}

startGame(room);
}

// START GAME SCREEN
function startGame(room) {
document.getElementById("home").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");

document.getElementById("roomText").innerText = room;
}

// DICE ROLL
function rollDice() {
const num = Math.floor(Math.random() * 6) + 1;
document.getElementById("dice").innerText = num;
}
</script>

</body>
</html>
